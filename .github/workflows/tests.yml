name: Base tests

# Keep manual dispatch available for controlled Golden Standard validation.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: base-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP lint — 8.4
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          tools: composer:2.10.2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install locked development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: ObjectPicker JavaScript contract
        run: node --test tests/js/object-picker-identifiers.test.mjs

      - name: Design Editor JavaScript contract
        run: node --test tests/js/design-editor-core.test.mjs tests/js/design-editor-boundary.test.mjs tests/js/design-shell-fullscreen.test.mjs tests/js/design-shell-profile-proof.test.mjs

      - name: Document Fixed JavaScript contract
        run: node --test tests/js/design-document-fixed.test.mjs tests/js/design-document-fixed-boundary.test.mjs

      - name: Document Flow JavaScript contract
        run: node --test tests/js/design-document-flow.test.mjs tests/js/design-document-flow-boundary.test.mjs

      - name: Mail Design JavaScript contract
        run: node --test tests/js/design-mail-profile.test.mjs

      - name: Data Mapper JavaScript contract
        run: node --test tests/js/data-mapper-boundary.test.mjs

      - name: PHP syntax
        run: bash tests/bin/php-lint.sh

  integration:
    name: WordPress ${{ matrix.wordpress }} — PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        wordpress: ['7.0', '7.1']
        php: ['8.4', '8.5']

    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_CORE_DIR: /tmp/core-blueprint-wp
      WP_TESTS_DIR: /tmp/core-blueprint-wp-tests
      CB_PLUGIN_FILE: /tmp/core-blueprint-wp/wp-content/plugins/core-blueprint/core-blueprint.php
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASSWORD: root
      WP_DB_HOST: 127.0.0.1:3306
      CB_LIFECYCLE_TABLE_PREFIX: cblifecycle_
      CB_CONSUMER_TABLE_PREFIX: cbconsumer_
      CB_B3_TABLE_PREFIX: cbb3_
      CB_CLI_TABLE_PREFIX: cbcli_
      CB_PERFORMANCE_TABLE_PREFIX: cbperf_
      CB_WP_CLI_PHAR: /tmp/core-blueprint-tools/wp-cli-2.12.0.phar

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, mysqli, sodium, xml, xmlwriter
          tools: composer:2.10.2
          coverage: none

      - name: Install locked development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install pinned WordPress test environment
        run: bash tests/bin/install-wp-tests.sh "${{ matrix.wordpress }}"

      - name: Run integration suite
        run: vendor/bin/phpunit --testsuite integration

      - name: Run performance baseline harness
        env:
          CB_PERFORMANCE_RESULTS_DIR: ${{ runner.temp }}/cb-performance-baseline
        run: bash tests/bin/run-performance-baseline.sh

      - name: Upload performance baseline
        uses: actions/upload-artifact@v4.6.2
        with:
          name: base-performance-wp-${{ matrix.wordpress }}-php-${{ matrix.php }}
          path: ${{ runner.temp }}/cb-performance-baseline
          if-no-files-found: error
          retention-days: 14

      - name: Run request-boundary lifecycle/data scenario
        run: bash tests/bin/run-lifecycle-scenario.sh

      - name: Install pinned canonical Extension Starter
        run: bash tests/bin/install-pinned-starter.sh

      - name: Run pinned Starter source conformance
        run: php "$WP_CORE_DIR/wp-content/plugins/core-blueprint-starter-plugin/tools/conformance.php"

      - name: Run pinned Starter consumer scenario
        run: bash tests/bin/run-consumer-scenario.sh

      - name: Run full 12-module request-boundary conformance matrix
        run: bash tests/bin/run-module-conformance-scenario.sh

      - name: Install pinned WP-CLI 2.12.0
        run: bash tests/bin/install-wp-cli.sh

      - name: Run real WP-CLI smoke scenario
        run: bash tests/bin/run-cli-smoke-scenario.sh "${{ matrix.wordpress }}"

      - name: Run real WP-CLI Role Policy / Failsafe conformance
        run: bash tests/bin/run-cli-role-policy-failsafe-conformance.sh "${{ matrix.wordpress }}"

      - name: Run real WP-CLI provenance / Scanner attribution conformance
        run: bash tests/bin/run-cli-provenance-conformance.sh "${{ matrix.wordpress }}"

      - name: Run Media Replace durable state conformance
        run: bash tests/bin/run-media-replace-persistence-conformance.sh "${{ matrix.wordpress }}"

  uninstall:
    name: Destructive uninstall — WordPress 7.0 — PHP 8.4
    runs-on: ubuntu-24.04
    needs: lint

    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_CORE_DIR: /tmp/core-blueprint-uninstall-wp
      WP_TESTS_DIR: /tmp/core-blueprint-uninstall-wp-tests
      CB_PLUGIN_FILE: /tmp/core-blueprint-uninstall-wp/wp-content/plugins/core-blueprint/core-blueprint.php
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASSWORD: root
      WP_DB_HOST: 127.0.0.1:3306
      CB_UNINSTALL_TABLE_PREFIX: cbuninstall_

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, mysqli, sodium, xml, xmlwriter
          tools: composer:2.10.2
          coverage: none

      - name: Install pinned WordPress 7.0 runtime
        run: bash tests/bin/install-wp-tests.sh 7.0

      - name: Run real destructive uninstall scenario
        run: bash tests/bin/run-uninstall-scenario.sh

  release-package:
    name: Release package — WordPress 7.0 — PHP 8.4
    runs-on: ubuntu-24.04
    needs: lint

    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      CB_PREVIOUS_RC_SHA: 9786408510d51fa55ccc070ae3dc4aa5a1190856
      CB_PREVIOUS_RC_VERSION: 1.0.0-rc1
      CB_CANDIDATE_VERSION: 1.0.0-rc1
      CB_WP_CLI_PHAR: /tmp/core-blueprint-release-tools/wp-cli-2.12.0.phar
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASSWORD: root
      WP_DB_HOST: 127.0.0.1:3306

    steps:
      - name: Checkout candidate with previous RC history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, mysqli, sodium, xml, xmlwriter
          coverage: none

      - name: Build candidate production ZIP
        run: python3 tools/build-release --output-dir "$RUNNER_TEMP/cb-release-candidate"

      - name: Resolve candidate artifact
        run: echo "CB_CANDIDATE_ZIP=$RUNNER_TEMP/cb-release-candidate/core-blueprint-$CB_CANDIDATE_VERSION.zip" >> "$GITHUB_ENV"

      - name: Validate candidate package boundary
        run: bash tests/bin/run-release-package-scenario.sh "$CB_CANDIDATE_ZIP" "$CB_CANDIDATE_VERSION"

      - name: Materialize pinned previous RC
        run: git worktree add --detach "$RUNNER_TEMP/cb-release-previous-source" "$CB_PREVIOUS_RC_SHA"

      - name: Build pinned previous RC with current canonical builder
        run: >-
          python3 tools/build-release
          --source "$RUNNER_TEMP/cb-release-previous-source"
          --output-dir "$RUNNER_TEMP/cb-release-previous"

      - name: Resolve previous RC artifact
        run: echo "CB_PREVIOUS_ZIP=$RUNNER_TEMP/cb-release-previous/core-blueprint-$CB_PREVIOUS_RC_VERSION.zip" >> "$GITHUB_ENV"

      - name: Validate previous RC package boundary
        run: bash tests/bin/run-release-package-scenario.sh "$CB_PREVIOUS_ZIP" "$CB_PREVIOUS_RC_VERSION"

      - name: Install pinned WP-CLI 2.12.0
        run: bash tests/bin/install-wp-cli.sh

      - name: Run release ZIP fresh-install and update smoke
        run: >-
          bash tests/bin/run-release-install-scenario.sh
          "$CB_CANDIDATE_ZIP"
          "$CB_PREVIOUS_ZIP"
          "$CB_CANDIDATE_VERSION"
          "$CB_PREVIOUS_RC_VERSION"

      - name: Upload candidate release artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: core-blueprint-${{ env.CB_CANDIDATE_VERSION }}
          path: |
            ${{ runner.temp }}/cb-release-candidate/core-blueprint-${{ env.CB_CANDIDATE_VERSION }}.zip
            ${{ runner.temp }}/cb-release-candidate/core-blueprint-${{ env.CB_CANDIDATE_VERSION }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
