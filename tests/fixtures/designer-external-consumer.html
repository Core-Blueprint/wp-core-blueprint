<div data-cb-design-launch-root data-cb-design-title="External Designer">
	<div data-cb-design-launch-context>
		<h1>External consumer settings</h1>
	</div>

	<div class="cb-core-design-shell" data-cb-design-shell hidden>
		<div class="cb-core-design-shell__toolbar">
			<div class="cb-core-design-shell__toolbar-group">
				<span data-cb-design-shell-group-label>History</span>
				<button type="button" class="button cb-core-button" data-cb-design-shell-undo disabled>Undo</button>
				<button type="button" class="button cb-core-button" data-cb-design-shell-redo disabled>Redo</button>
			</div>
			<div class="cb-core-design-shell__toolbar-group">
				<button type="button" class="button cb-core-button cb-core-button--secondary" data-cb-design-shell-fullscreen data-cb-design-shell-fullscreen-enter-label="Open focus mode" data-cb-design-shell-fullscreen-exit-label="Exit focus mode" aria-pressed="false">Open focus mode</button>
				<button type="button" class="button cb-core-button cb-core-button--primary" data-cb-design-shell-primary-action>Save</button>
			</div>
		</div>

		<div class="cb-core-design-shell__workspace">
			<aside class="cb-core-design-shell__palette" aria-label="Elements">Palette</aside>
			<main class="cb-core-design-shell__canvas">Canvas</main>
			<aside class="cb-core-design-shell__sidebar" aria-label="Properties">
				<div class="cb-core-design-shell__sidebar-tabs">
					<button type="button" class="cb-core-design-shell__sidebar-tab" data-cb-design-shell-tab="inspector" data-cb-design-shell-sidebar-role="inspector">Inspector</button>
					<button type="button" class="cb-core-design-shell__sidebar-tab" data-cb-design-shell-tab="layers" data-cb-design-shell-sidebar-role="layers">Layers</button>
					<button type="button" class="cb-core-design-shell__sidebar-tab" data-cb-design-shell-tab="settings" data-cb-design-shell-sidebar-role="settings">Settings</button>
				</div>
				<div class="cb-core-design-shell__sidebar-panel" data-cb-design-shell-panel="inspector">Inspector content</div>
				<div class="cb-core-design-shell__sidebar-panel" data-cb-design-shell-panel="layers" hidden>Layers content</div>
				<div class="cb-core-design-shell__sidebar-panel" data-cb-design-shell-panel="settings" hidden>Settings content</div>
			</aside>
		</div>
	</div>
</div>
